name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One zip per skill, with the skill folder at the zip root, as claude.ai expects.
      - run: |
          mkdir dist
          cd skills
          for d in */; do zip -r "../dist/${d%/}.zip" "$d"; done
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
